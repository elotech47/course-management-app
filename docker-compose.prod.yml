version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: course-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-course_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_password}
      POSTGRES_DB: ${POSTGRES_DB:-course_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-network

  backend:
    build:
      context: ./backend
      dockerfile: ${DEPLOY_MODE:-production} == "production" ? Dockerfile.prod : Dockerfile
    container_name: course-management-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-course_admin}:${POSTGRES_PASSWORD:-course_password}@postgres:5432/${POSTGRES_DB:-course_management}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: course-management-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - course-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  course-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
